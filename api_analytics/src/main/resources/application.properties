spring.application.name=api_analytics
server.port=8080

spring.datasource.url=jdbc:postgresql://db-analytics:5432/db_analytics
spring.datasource.username=admin
spring.datasource.password=admin123

spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=innovatech-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.innovatech.api_analytics.dto.ProyectoEvent

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true